[build]
  # Install all workspace deps, then build just the sovra frontend
  command = "npm install -g pnpm@10 && pnpm install --frozen-lockfile && pnpm --filter @workspace/sovra build"
  publish = "artifacts/sovra/dist/public"

[build.environment]
  NODE_VERSION = "20"
  BASE_PATH = "/"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
